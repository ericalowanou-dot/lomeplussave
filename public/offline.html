<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hors connexion - Lome+</title>
<link rel="icon" type="image/png" href="/assets/icons/pwa/icon-96.png">
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #f5f5f5;
    font-family: 'Poppins', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    color: #1f2937;
    padding: 24px;
  }
  .card {
    max-width: 420px;
    width: 100%;
    background: #fff;
    border-radius: 16px;
    box-shadow: 0 4px 20px rgba(15, 23, 42, 0.08);
    padding: 32px 24px;
    text-align: center;
  }
  .card img { width: 72px; height: 72px; margin-bottom: 16px; }
  h1 { font-size: 1.25rem; font-weight: 700; margin: 0 0 8px; }
  p { font-size: 0.95rem; color: #6b7280; margin: 0 0 24px; line-height: 1.6; }
  button {
    background: #ff7b00;
    color: #fff;
    border: none;
    padding: 12px 24px;
    border-radius: 9999px;
    font-weight: 600;
    font-size: 0.95rem;
    cursor: pointer;
  }
  button:active { transform: scale(0.98); }
</style>
</head>
<body>
  <div class="card">
    <img src="/assets/icons/pwa/icon-96.png" alt="Lome+">
    <h1>Vous êtes hors connexion</h1>
    <p>Cette page n'a pas pu être chargée. Vérifiez votre connexion Internet et réessayez. Les pages déjà consultées restent disponibles hors-ligne.</p>
    <button onclick="location.reload()">Réessayer</button>
  </div>
</body>
</html>
